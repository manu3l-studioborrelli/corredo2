# Controllo del tema a ogni push. Sostituisce il workflow CI di Dawn,
# la cui parte Lighthouse richiede segreti dello store Shopify che
# questo progetto non espone.
name: Theme Check

on: [push, pull_request]

jobs:
  theme-check:
    name: Theme Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Theme Check
        uses: shopify/theme-check-action@v2
        with:
          token: ${{ github.token }}
